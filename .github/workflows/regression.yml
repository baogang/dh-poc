name: POC regression
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run DeepSeek frozen regression split (requires repository secret)
        type: boolean
        default: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests -v
      - run: npm run eval:offline
      - run: node scripts/check-v2-regression.mjs --suite engineering --require-current-source
      - run: npm run check
      - if: github.event_name == 'workflow_dispatch' && inputs.live
        run: npm run eval:live
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
      - if: github.event_name == 'workflow_dispatch' && inputs.live
        run: node scripts/check-v2-regression.mjs --suite all --require-current-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-regression-reports
          path: reports/
          retention-days: 30
