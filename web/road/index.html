<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Service · 工单助手</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><div class="brand"><span class="brand-icon">R</span><div><strong>ROAD SERVICE</strong><small id="brand-meta">PI SDK · DeepSeek Flash · MOCK 测试</small></div></div><div class="header-actions"><label class="language-picker"><span id="locale-caption">界面语言</span><select id="ui-language" aria-label="界面语言 / Interface language"><option value="zh">中文</option><option value="en">English</option></select></label><button id="new-session" class="secondary">新对话</button></div></header>
<main class="chat-shell"><div class="chat-heading"><div><span class="eyebrow">CITIZEN ASSISTANT</span><h1 id="app-title">工单助手</h1></div><span id="status" class="status">正在连接</span></div><div class="chat-toolbar"><label id="show-tasks-control" class="check" title="在聊天中显示任务计划"><input id="show-tasks" type="checkbox" checked><span id="show-tasks-label">显示任务列表</span></label><span id="emotion-status" class="emotion-status" role="status" hidden></span><span id="toolbar-hint">计划、情绪和确认都在聊天中</span></div>
<div id="messages" class="messages" role="log" aria-live="polite" aria-label="对话、任务计划与操作确认"></div>
<form id="chat-form" class="composer"><label id="message-label" class="sr-only" for="chat-message">消息</label><textarea id="chat-message" rows="2" maxlength="4000" placeholder="描述问题，或告诉我你想改变什么…"></textarea><div><span id="composer-hint" class="hint">Enter 发送 · Shift+Enter 换行 · 中文 / English / العربية</span><button type="button" id="stop" class="secondary">停止</button><button id="send">发送</button></div></form>
<details id="test-tools" class="test-tools"><summary id="test-tools-label">测试工具与运行记录</summary><p id="test-tools-hint" class="hint">仅用于测试查看；工单处理所需的操作均在聊天中。</p><div id="human-section" class="debug-section"><h2 id="human-title">模拟人工工作台</h2><div id="human"></div></div><div class="debug-section"><h2 id="knowledge-title">问答库</h2><div id="knowledge"></div></div><div class="debug-section"><h2 id="receipts-title">实际 API 回执</h2><div id="receipts"></div></div><div class="debug-section"><h2 id="events-title">执行记录</h2><div id="events"></div></div></details>
</main></body></html>
